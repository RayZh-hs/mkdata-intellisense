name: Release and Publish Extension

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.1.3, etc.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install vsce
      run: npm install -g @vscode/vsce
      
    - name: Build extension
      run: npm run build:prod
      
    - name: Package extension
      run: vsce package
      
    - name: Get package info
      id: package
      run: |
        echo "name=$(node -p \"require('./package.json').name\")" >> $GITHUB_OUTPUT
        echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
        echo "displayname=$(node -p \"require('./package.json').displayName\")" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ steps.package.outputs.displayname }} v${{ steps.package.outputs.version }}
        draft: false
        prerelease: false
        files: |
          *.vsix
        body: |
          ## What's Changed
          
          Release of ${{ steps.package.outputs.displayname }} version ${{ steps.package.outputs.version }}.
          
          ### Installation
          
          You can install this extension:
          1. Download the `.vsix` file from this release
          2. Open VS Code
          3. Go to Extensions view (Ctrl+Shift+X)
          4. Click the "..." menu and select "Install from VSIX..."
          5. Select the downloaded `.vsix` file
          
          Or install directly from the VS Code Marketplace.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Publish to VS Code Marketplace
      run: vsce publish --pat ${{ secrets.VSCE_PAT }}
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}